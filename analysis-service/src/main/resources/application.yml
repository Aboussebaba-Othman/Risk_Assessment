server:
  port: 9004
spring:
  application:
    name: analysis-service
  cloud:
    config:
      enabled: true
      uri: http://config-server:8888
      fail-fast: false
  datasource:
    url: jdbc:postgresql://postgres:5432/analysis_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: update
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/risk-assessment/protocol/openid-connect/certs
eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
logging:
  level:
    root: INFO
    com.riskassessment.analysis: DEBUG
