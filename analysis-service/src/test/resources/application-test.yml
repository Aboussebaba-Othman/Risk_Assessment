spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:analysis_test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    enabled: false

server:
  port: 8080

logging:
  level:
    com.riskassessment.analysis: DEBUG
