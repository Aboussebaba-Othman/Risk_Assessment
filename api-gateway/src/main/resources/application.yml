server:
  port: ${SERVER_PORT:9000}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # auth-service:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2

        # company-service:
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**
          filters:
            - StripPrefix=2

        # scoring-service:
        - id: scoring-service
          uri: lb://scoring-service
          predicates:
            - Path=/api/v1/scores/**

        # analysis-service:
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/api/v1/analysis/**
          filters:
            - StripPrefix=2

        # report-service:
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**

        # alert-service:
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**
          filters:
            - StripPrefix=2

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"