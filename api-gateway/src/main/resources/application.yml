server:
  port: 9000

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**
            
        - id: scoring-service
          uri: lb://scoring-service
          predicates:
            - Path=/api/v1/scores/**
            
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/api/v1/analysis/**

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: "*"