server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/v1/auth/**
        - id: company-service
          uri: lb://company-service
          predicates:
            - Path=/api/v1/companies/**
        - id: scoring-service
          uri: lb://scoring-service
          predicates:
            - Path=/api/v1/scores/**
        - id: analysis-service
          uri: lb://analysis-service
          predicates:
            - Path=/api/v1/analysis/**
        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/v1/reports/**
        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/v1/alerts/**, /api/v1/notifications/**
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/risk-assessment-realm
          jwk-set-uri: ${KEYCLOAK_URL:http://localhost:8081}/realms/risk-assessment-realm/protocol/openid-connect/certs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO
