server:
  port: ${SERVER_PORT:9003}

spring:
  application:
    name: scoring-service
  cloud:
    config:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/risk_assessment
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/risk-assessment
          jwk-set-uri: http://keycloak:8080/realms/risk-assessment/protocol/openid-connect/certs
  config:
    import: optional:configserver:http://config-server:8888/

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.riskassessment.scoring: DEBUG

resilience4j:
  circuitbreaker:
    instances:
      company-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      alert-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
  timelimiter:
    instances:
      company-service:
        timeout-duration: 3s
      alert-service:
        timeout-duration: 3s
