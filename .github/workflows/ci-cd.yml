name: Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" , "dev"]
  pull_request:
    branches: [ "main" , "dev"]

jobs:
  build-and-test:
    name: Build & Test (Maven)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          
      - name: Build and Test with Maven
        run: mvn clean install -B
        
      - name: Upload JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-jars
          path: |
            */target/*.jar
          retention-days: 1

  docker-build-push:
    name: Build & Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - config-server
          - eureka-server
          - api-gateway
          - auth-service
          - company-service
          - scoring-service
          - analysis-service
          - report-service
          - alert-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Download JAR Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .
          
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
          
      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          file: ./${{ matrix.service }}/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${{ github.sha }}

  api-tests:
    name: End-to-End API Testing
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Download JAR Artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-jars
          path: .
          
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Start Infrastructure and Services
        run: |
          docker compose up -d --build
          
      - name: Wait for Infrastructure Readiness
        run: |
          echo "Waiting for PostgreSQL..."
          until [ "`docker inspect -f {{.State.Health.Status}} postgres`" == "healthy" ]; do sleep 5; done
          echo "Waiting for RabbitMQ..."
          until [ "`docker inspect -f {{.State.Health.Status}} rabbitmq`" == "healthy" ]; do sleep 5; done
          echo "Waiting for Keycloak..."
          until [ "`docker inspect -f {{.State.Health.Status}} keycloak`" == "healthy" ]; do sleep 5; done
          
      - name: Wait for Microservices
        run: |
          echo "Waiting for API Gateway to be ready (giving services time to register with Eureka)..."
          # Wait until API Gateway is responding or simply sleep to ensure Eureka registration is propagated
          sleep 60
          # Test if it responds on port 9000 (even with a 404 or 401, it means the server is up)
          curl -sI http://localhost:9000 || echo "Gateway up"
          sleep 15
          
      - name: Install Newman
        run: npm install -g newman
        
      - name: Run Postman Tests via Newman
        run: newman run Risk_Assessment_Platform.postman_collection.json
        
      - name: Capture Logs on Failure
        if: failure()
        run: docker compose logs
