server:
  port: 8081

spring:
  application:
    name: auth-service
  
  # Désactiver temporairement Config Server
  cloud:
    config:
      enabled: false
  
  # Base de données PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/risk_assessment_auth
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  
  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Redis
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

# Désactiver temporairement Eureka
eureka:
  client:
    enabled: false

# JWT Configuration
jwt:
  secret: myVerySecretKeyForRiskAssessmentPlatform2024MustBeLongEnoughForHS512Algorithm
  expiration: 900000  # 15 minutes
  refresh-expiration: 604800000  # 7 jours

# OpenAPI Documentation
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Management
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Logging
logging:
  level:
    root: INFO
    com.riskassessment.auth: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
